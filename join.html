<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Register at SOLEHOUSE – Create your account, unlock custom sneakers, drops & streetwear.">
    <title>Register | SOLEHOUSE — Custom Sneaker & Streetwear</title>
    <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👟</text></svg>" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..900&display=swap" rel="stylesheet">
    <style>
        /* ----- RESET & VARIABLES ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-primary: #FFFFFF;
            --bg-secondary: #F7F7F7;
            --text-main: #0F0F0F;
            --text-muted: #3A3A3A;
            --card-bg: #FFFFFF;
            --border-subtle: #E0E0E0;
            --accent-orange: #FF4600;
            --navbar-bg: #FFFFFF;
            --pure-white: #FFFFFF;
            --pure-black: #0F0F0F;
            --input-bg: #FFFFFF;
        }
        [data-theme="dark"] {
            --bg-primary: #0F0F0F;
            --bg-secondary: #1A1A1A;
            --text-main: #FFFFFF;
            --text-muted: #B0B0B0;
            --card-bg: #1E1E1E;
            --border-subtle: #2E2E2E;
            --accent-orange: #FF4600;
            --navbar-bg: #0F0F0F;
            --pure-white: #FFFFFF;
            --pure-black: #0F0F0F;
            --input-bg: #1A1A1A;
        }
        html, body {
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            transition: background-color 0.3s, color 0.3s;
            line-height: 1.5;
        }
        a { text-decoration: none; color: inherit; }

        /* ----- TOP BAR ----- */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
            background: transparent;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transition: opacity 0.2s;
        }
        .logo:hover { opacity: 0.8; }
        .logo-icon {
            width: 3rem;
            height: 3rem;
            background-color: var(--bg-primary);
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid var(--accent-orange);
        }
        .logo-icon i { color: var(--accent-orange); font-size: 1.75rem; }
        .logo-text-wrap {
            display: flex;
            flex-direction: column;
            line-height: 1.1;
        }
        .logo-text {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--text-main);
            letter-spacing: -0.03em;
        }
        .logo-text span { color: var(--accent-orange); }
        .logo-tagline {
            font-size: 0.6rem;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 0.4px;
        }

        .top-right {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .icon-btn {
            width: 2.75rem;
            height: 2.75rem;
            background-color: var(--card-bg);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            border: 2px solid var(--accent-orange);
            cursor: pointer;
            transition: 0.2s;
            font-size: 1rem;
        }
        .icon-btn:hover {
            background-color: var(--accent-orange);
            color: var(--pure-white);
        }

        /* ----- CENTERED REGISTER CONTAINER ----- */
        .register-page {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5rem 1rem 2rem 1rem;
            background-color: var(--bg-secondary);
        }
        .register-card {
            width: 100%;
            max-width: 460px;
            background: var(--card-bg);
            border: 3px solid var(--border-subtle);
            border-radius: 2rem;
            padding: 2.25rem 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.06);
            transition: 0.3s;
            max-height: calc(100vh - 7rem);
            overflow: hidden;
        }
        [data-theme="dark"] .register-card {
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .register-header {
            text-align: center;
            margin-bottom: 1.25rem;
        }
        .register-header .tag {
            color: var(--accent-orange);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.72rem;
            display: block;
            margin-bottom: 0.4rem;
        }
        .register-header h1 {
            font-size: 1.85rem;
            font-weight: 900;
            color: var(--text-main);
            letter-spacing: -0.03em;
            margin-bottom: 0.3rem;
        }
        .register-header h1 span { color: var(--accent-orange); }
        .register-header p {
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.85rem;
        }

        /* Social buttons */
        .social-login {
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
            margin-bottom: 1rem;
        }
        .social-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            padding: 0.75rem 1.25rem;
            border-radius: 1rem;
            border: 2px solid var(--border-subtle);
            background: var(--card-bg);
            color: var(--text-main);
            font-family: inherit;
            font-weight: 700;
            font-size: 0.875rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .social-btn:hover {
            border-color: var(--accent-orange);
            transform: translateY(-2px);
        }
        .social-btn svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1rem 0;
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-subtle);
        }

        /* Form */
        .form-group {
            margin-bottom: 0.85rem;
        }
        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 0.82rem;
            margin-bottom: 0.4rem;
            color: var(--text-main);
        }
        .input-wrap {
            position: relative;
        }
        .input-wrap i.field-icon {
            position: absolute;
            left: 1.1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent-orange);
            font-size: 0.9rem;
            pointer-events: none;
        }
        .form-input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.7rem;
            border-radius: 1rem;
            border: 2px solid var(--border-subtle);
            background: var(--input-bg);
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.88rem;
            font-weight: 500;
            transition: 0.2s;
            outline: none;
        }
        .form-input::placeholder { color: var(--text-muted); opacity: 0.7; }
        .form-input:focus {
            border-color: var(--accent-orange);
            box-shadow: 0 0 0 4px rgba(255,70,0,0.1);
        }
        .toggle-pass {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9rem;
            padding: 0.25rem;
        }
        .toggle-pass:hover { color: var(--accent-orange); }

        .terms-row {
            display: flex;
            align-items: flex-start;
            gap: 0.6rem;
            margin: 0.75rem 0 1.15rem 0;
            font-size: 0.82rem;
            color: var(--text-muted);
            font-weight: 500;
            line-height: 1.4;
        }
        .terms-row input {
            accent-color: var(--accent-orange);
            width: 1rem;
            height: 1rem;
            cursor: pointer;
            margin-top: 0.15rem;
            flex-shrink: 0;
        }
        .terms-row a {
            color: var(--accent-orange);
            font-weight: 700;
        }
        .terms-row a:hover { text-decoration: underline; }

        .register-submit {
            width: 100%;
            background: var(--accent-orange);
            color: var(--pure-white);
            padding: 0.9rem;
            border-radius: 1rem;
            font-weight: 800;
            font-size: 0.95rem;
            border: 2px solid var(--accent-orange);
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .register-submit:hover {
            background: transparent;
            color: var(--text-main);
            border-color: var(--text-main);
        }

        .login-link {
            text-align: center;
            margin-top: 1.1rem;
            font-size: 0.87rem;
            color: var(--text-muted);
            font-weight: 500;
        }
        .login-link a {
            color: var(--accent-orange);
            font-weight: 800;
            transition: 0.2s;
        }
        .login-link a:hover { text-decoration: underline; }

        /* Small screen adjustment */
        @media (max-width: 480px) {
            .top-bar { padding: 0.75rem 1rem; }
            .logo-icon { width: 2.5rem; height: 2.5rem; }
            .logo-icon i { font-size: 1.4rem; }
            .logo-text { font-size: 1.15rem; }
            .logo-tagline { font-size: 0.5rem; }
            .icon-btn { width: 2.35rem; height: 2.35rem; font-size: 0.9rem; }
            .register-card { padding: 1.75rem 1.35rem; border-radius: 1.75rem; }
            .register-header h1 { font-size: 1.55rem; }
        }
    </style>
</head>
<body>

<!-- TOP BAR: logo left, toggles right -->
<div class="top-bar">
    <a href="index.html" class="logo">
        <div class="logo-icon"><i class="fas fa-shoe-prints"></i></div>
        <div class="logo-text-wrap">
            <div class="logo-text">SOLE<span>HOUSE</span></div>
            <span class="logo-tagline">CUSTOM SNEAKER & STREETWEAR</span>
        </div>
    </a>
    <div class="top-right">
        <button class="icon-btn" id="rtl-toggle" title="Toggle RTL"><i class="fas fa-exchange-alt"></i></button>
        <button class="icon-btn" id="theme-toggle" title="Toggle Theme"><i class="fas fa-moon" id="theme-icon"></i></button>
    </div>
</div>

<!-- CENTERED REGISTER CARD -->
<div class="register-page">
    <div class="register-card">
        <div class="register-header">
            <span class="tag"><i class="fas fa-fire"></i> Join the Movement</span>
            <h1>CREATE <span>ACCOUNT</span></h1>
            <p>Sign up and unlock the heat.</p>
        </div>

        <!-- Social signup buttons with original brand logos -->
        <div class="social-login">

            <!-- Google (official multi-color G) -->
            <button type="button" class="social-btn" onclick="socialSignup('google')">
                <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
                    <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
                    <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
                    <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
                </svg>
                Sign up with Google
            </button>

            <!-- Facebook (official blue f) -->
            <button type="button" class="social-btn" onclick="socialSignup('facebook')">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#1877F2" d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                </svg>
                Sign up with Facebook
            </button>

            <!-- Apple (official black apple logo) -->
            <button type="button" class="social-btn" onclick="socialSignup('apple')">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path fill="currentColor" d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
                </svg>
                Sign up with Apple
            </button>

        </div>

        <!-- Divider -->
        <div class="divider">or</div>

        <!-- Register form -->
        <form id="register-form">
            <div class="form-group">
                <label for="fullname">Full Name</label>
                <div class="input-wrap">
                    <i class="fas fa-user field-icon"></i>
                    <input type="text" id="fullname" class="form-input" placeholder="Enter your full name" required>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-wrap">
                    <i class="fas fa-envelope field-icon"></i>
                    <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrap">
                    <i class="fas fa-lock field-icon"></i>
                    <input type="password" id="password" class="form-input" placeholder="Create a password" required minlength="6">
                    <button type="button" class="toggle-pass" id="toggle-pass" aria-label="Toggle password visibility">
                        <i class="fas fa-eye" id="eye-icon"></i>
                    </button>
                </div>
            </div>

            <label class="terms-row">
                <input type="checkbox" id="terms" required>
                <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>. I want the heat.</span>
            </label>

            <button type="submit" class="register-submit">
                <i class="fas fa-user-plus"></i> Create Account
            </button>
        </form>

        <div class="login-link">
            Already have an account? <a href="login.html">Log in</a>
        </div>
    </div>
</div>

<script>
    (function() {
        const htmlEl = document.documentElement;
        const themeBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const rtlBtn = document.getElementById('rtl-toggle');

        /* Load saved preferences */
        const savedTheme = localStorage.getItem('theme') || 'light';
        const savedDir = localStorage.getItem('direction') || 'ltr';
        htmlEl.setAttribute('data-theme', savedTheme);
        htmlEl.setAttribute('dir', savedDir);
        updateThemeIcon(savedTheme);

        function updateThemeIcon(theme) {
            themeIcon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        }

        /* Theme toggle */
        themeBtn.addEventListener('click', () => {
            const current = htmlEl.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            htmlEl.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            updateThemeIcon(next);
        });

        /* RTL toggle */
        rtlBtn.addEventListener('click', () => {
            const current = htmlEl.getAttribute('dir');
            const next = current === 'rtl' ? 'ltr' : 'rtl';
            htmlEl.setAttribute('dir', next);
            localStorage.setItem('direction', next);
        });

        /* Password visibility toggle */
        const togglePass = document.getElementById('toggle-pass');
        const passInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eye-icon');

        togglePass.addEventListener('click', () => {
            const isPass = passInput.type === 'password';
            passInput.type = isPass ? 'text' : 'password';
            eyeIcon.className = isPass ? 'fas fa-eye-slash' : 'fas fa-eye';
        });

        /* Social signup simulation */
        window.socialSignup = function(provider) {
            const names = { google: 'Google', facebook: 'Facebook', apple: 'Apple' };
            alert('Sign up with ' + names[provider] + ' — redirecting...');
        };

        /* Form submit */
        const registerForm = document.getElementById('register-form');
        registerForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = registerForm.querySelector('.register-submit');
            const original = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';
            btn.disabled = true;

            setTimeout(() => {
                btn.innerHTML = '<i class="fas fa-check"></i> Welcome!';
                setTimeout(() => {
                    btn.innerHTML = original;
                    btn.disabled = false;
                    window.location.href = 'index.html';
                }, 800);
            }, 1100);
        });

        /* Prevent any scroll attempts on the body */
        document.body.addEventListener('wheel', (e) => {
            const card = document.querySelector('.register-card');
            if (card && card.scrollHeight > card.clientHeight) return;
            e.preventDefault();
        }, { passive: false });

        document.body.addEventListener('touchmove', (e) => {
            const card = document.querySelector('.register-card');
            if (card && card.scrollHeight > card.clientHeight) return;
            e.preventDefault();
        }, { passive: false });
    })();
</script>
</body>
</html>
