<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100vh;
            overflow: hidden; /* No scroll */
            background-color: #0d0d0d;
            color: #f2f2f2;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Abstract background shapes to give it a streetwear / modern vibe */
        .bg-shape {
            position: absolute;
            filter: blur(100px);
            z-index: 1;
            opacity: 0.5;
        }
        
        .shape-1 {
            width: 400px;
            height: 400px;
            background: #ff4500; /* vibrant orange/red */
            border-radius: 50%;
            top: -100px;
            left: -100px;
        }

        .shape-2 {
            width: 500px;
            height: 500px;
            background: #4169e1; /* royal blue */
            border-radius: 50%;
            bottom: -200px;
            right: -100px;
        }

        .container {
            z-index: 10;
            text-align: center;
            padding: 3rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(25, 25, 25, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(8rem, 20vw, 12rem);
            font-weight: 700;
            line-height: 1;
            letter-spacing: -5px;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #fff, #666);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
        }

        /* Glitch effect pseudo-elements */
        h1::before, h1::after {
            content: '404';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.8;
        }

        h1::before {
            color: #0ff;
            z-index: -1;
            transform: translate(-3px, -2px);
            animation: glitch-anim 2s infinite linear alternate-reverse;
            -webkit-text-fill-color: #0ff;
        }

        h1::after {
            color: #f0f;
            z-index: -2;
            transform: translate(3px, 2px);
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
            -webkit-text-fill-color: #f0f;
        }

        @keyframes glitch-anim {
            0% { clip-path: inset(10% 0 30% 0); transform: translate(-3px, 2px); }
            20% { clip-path: inset(80% 0 5% 0); transform: translate(3px, -2px); }
            40% { clip-path: inset(40% 0 50% 0); transform: translate(-3px, 2px); }
            60% { clip-path: inset(90% 0 2% 0); transform: translate(3px, -2px); }
            80% { clip-path: inset(20% 0 70% 0); transform: translate(-3px, 2px); }
            100% { clip-path: inset(50% 0 30% 0); transform: translate(3px, -2px); }
        }

        @keyframes glitch-anim-2 {
            0% { clip-path: inset(30% 0 10% 0); transform: translate(3px, -2px); }
            20% { clip-path: inset(5% 0 80% 0); transform: translate(-3px, 2px); }
            40% { clip-path: inset(50% 0 40% 0); transform: translate(3px, -2px); }
            60% { clip-path: inset(2% 0 90% 0); transform: translate(-3px, 2px); }
            80% { clip-path: inset(70% 0 20% 0); transform: translate(3px, -2px); }
            100% { clip-path: inset(30% 0 50% 0); transform: translate(-3px, 2px); }
        }

        h2 {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1rem;
            color: #fff;
        }

        p {
            font-size: 1.1rem;
            color: #aaa;
            margin-bottom: 2.5rem;
            max-width: 85%;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #0d0d0d;
            background: #fff;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0%;
            height: 100%;
            background: #ff4500;
            transition: all 0.3s ease;
            z-index: -1;
        }

        .btn:hover {
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(255, 69, 0, 0.3);
        }

        .btn:hover::before {
            width: 100%;
        }
        
        .noise {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
            opacity: 0.04;
            background-image: url('data:image/svg+xml;charset=utf-8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
        }
    </style>
</head>
<body>
    <div class="noise"></div>
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <div class="container">
        <h1>404</h1>
        <h2>Dead End</h2>
        <p>The drop you're looking for doesn't exist or has already sold out. Let's get you back to the latest releases.</p>
        <a href="index.html" class="btn">Back to Shop</a>
    </div>
</body>
</html>
